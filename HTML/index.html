<!DOCTYPE html>

        <div class="row" id="gameboard1"></div>

        <div class="column" id="gameboard3"></div>
        <div class="column" id="gameboard4"></div>


        <div class= "empty" id="piece1"></div>

        <div class= "empty" id="piece4"></div>

        <div class= "empty" id="piece6"></div>

        <div class = "button" id = place1 onclick="buttonClick('piece1')"></div>

        <div class="nameSet" >

            </div>

        </div>

        <button class="startbuttun" onclick ="Host()">
            Start Game
        </button>

        <button class="startbuttun" onclick ="joinGame()">
            Join Others Game
        </button>


        <!-- <button onclick ="getGameBoard()">
            Get
        </button>
        <button onclick ="saveGameBoardToServer()">

        </button> -->
